<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">asyngo — annotate Go, ship AsyncAPI</title>
  <desc id="desc">Go source annotations flow through asyngo into an AsyncAPI 3.1 document.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#111235"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111f37" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0b1527" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8b7cff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020711" flood-opacity="0.58"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="480" rx="28" fill="url(#background)"/>
  <rect width="1280" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1120" cy="62" r="160" fill="#6f61ff" opacity="0.08" filter="url(#glow)"/>
  <circle cx="154" cy="442" r="190" fill="#00add8" opacity="0.07" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="80" y="82" fill="#93a4be" font-size="14" letter-spacing="3">GO SOURCE</text>
    <text x="80" y="142" fill="#f5f8ff" font-size="54" font-weight="700" letter-spacing="-2">Annotate Go.</text>
    <text x="80" y="202" fill="url(#accent)" font-size="54" font-weight="700" letter-spacing="-2">Ship AsyncAPI.</text>
    <text x="82" y="244" fill="#9eacc2" font-size="18">Keep the contract next to the code that implements it.</text>
  </g>

  <g transform="translate(80 286)" filter="url(#shadow)">
    <rect width="468" height="142" rx="16" fill="url(#panel)" stroke="#263b5b"/>
    <circle cx="24" cy="23" r="5" fill="#ff6b7a"/>
    <circle cx="42" cy="23" r="5" fill="#f6c85f"/>
    <circle cx="60" cy="23" r="5" fill="#50d890"/>
    <text x="88" y="28" fill="#6f829f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">handler.go</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="24" y="60" fill="#6f829f">//</text>
      <text x="48" y="60" fill="#61d8fa">@Channel</text>
      <text x="136" y="60" fill="#dce6f5">/market/{pair}</text>
      <text x="24" y="86" fill="#6f829f">//</text>
      <text x="48" y="86" fill="#61d8fa">@Operation</text>
      <text x="154" y="86" fill="#c8bfff">receive</text>
      <text x="24" y="112" fill="#6f829f">//</text>
      <text x="48" y="112" fill="#61d8fa">@Message</text>
      <text x="136" y="112" fill="#dce6f5">ticker TickerPayload</text>
    </g>
  </g>

  <g transform="translate(590 310)">
    <path d="M0 30 C70 30 70 30 138 30" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="30" r="5" fill="#00add8"/>
    <circle cx="69" cy="30" r="5" fill="#5a8fea"/>
    <circle cx="114" cy="30" r="5" fill="#8b7cff"/>
    <path d="M132 22 L142 30 L132 38" fill="none" stroke="#8b7cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="52" width="64" height="26" rx="13" fill="#101d34" stroke="#293c5e"/>
    <text x="74" y="70" fill="#d9e5f5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">asyngo</text>
  </g>

  <g transform="translate(770 52)" filter="url(#shadow)">
    <rect width="430" height="376" rx="18" fill="url(#panel)" stroke="#304066"/>
    <rect width="430" height="48" rx="18" fill="#172641"/>
    <path d="M0 48 H430" stroke="#304066"/>
    <circle cx="24" cy="24" r="5" fill="#ff6b7a"/>
    <circle cx="42" cy="24" r="5" fill="#f6c85f"/>
    <circle cx="60" cy="24" r="5" fill="#50d890"/>
    <text x="86" y="29" fill="#8091ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">asyncapi.yaml</text>
    <rect x="324" y="13" width="86" height="23" rx="11.5" fill="#211f50" stroke="#554a9e"/>
    <text x="367" y="29" fill="#bdb5ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">3.1 ready</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="24" y="84" fill="#61d8fa">asyncapi:</text>
      <text x="118" y="84" fill="#c8bfff">3.1.0</text>
      <text x="24" y="112" fill="#61d8fa">channels:</text>
      <text x="42" y="140" fill="#e3e9f4">marketPair:</text>
      <text x="60" y="168" fill="#61d8fa">address:</text>
      <text x="146" y="168" fill="#a8e7b5">/market/{pair}</text>
      <text x="60" y="196" fill="#61d8fa">messages:</text>
      <text x="78" y="224" fill="#e3e9f4">ticker:</text>
      <text x="96" y="252" fill="#61d8fa">$ref:</text>
      <text x="154" y="252" fill="#a8e7b5">'#/components/…'</text>
      <text x="24" y="294" fill="#61d8fa">operations:</text>
      <text x="42" y="322" fill="#e3e9f4">receiveMarketData:</text>
      <text x="60" y="350" fill="#61d8fa">action:</text>
      <text x="136" y="350" fill="#c8bfff">receive</text>
    </g>
  </g>
</svg>
